# NOTE: The platformVersion value MUST be identical to the one in the cplex-opl-jetbrains repo.
# Check the plugin's build.gradle.kts to see which IntelliJ Platform version is used there,
# and paste the exact same one here (PHASE 0 / PHASE 5 in PLAN.md).
platformVersion=2025.2.6.1

# Fallback plugin version used only when cplex-opl-jetbrains is not found locally.
# When cplex-opl-jetbrains exists alongside this project, the version is auto-detected.
pluginVersion=1.5.0

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
kotlin.stdlib.default.dependency=false
